name: Claude Code

# Thin caller — all review logic lives in the central reusable workflow in
# dev-spark. Edit energywell/dev-spark/.github/workflows/claude-review.yml to
# change behaviour for every repo (GX-6687).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    uses: energywell/dev-spark/.github/workflows/claude-review.yml@master
    secrets: inherit
